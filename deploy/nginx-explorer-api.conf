# Public HTTPS endpoint of the explorer API: explorer-api.identit.ee -> 127.0.0.1:8788.
#
# Installed as /etc/nginx/sites-available/explorer-api.identit.ee (symlinked into sites-enabled).
# This is the pre-TLS template: `certbot --nginx -d explorer-api.identit.ee` adds the 443 listener,
# the certificate paths and the HTTP -> HTTPS redirect to the installed copy (see docs/OPERATIONS.md).
# server_name is the reference deployment: set your own host. The front, a static site on another
# host, reads this API from the browser; the service itself allows its origin (CORS), nginx does not.
#
# The API is public and read only. Protection is a request rate per client address and a cap on
# live streams per address; there is no proxy cache. The service marks finalized blocks and
# extrinsics `Cache-Control: public, max-age=300`, which browsers honour, and everything else
# `no-store`.

# Requests per second per address. A page load makes a handful of calls at once, hence the burst.
limit_req_zone $binary_remote_addr zone=explorer_api:10m rate=10r/s;
# Open /api/live streams per address (the service also caps all streams together at 1000).
limit_conn_zone $binary_remote_addr zone=explorer_live:10m;

server {
	listen 80;
	listen [::]:80;
	server_name explorer-api.identit.ee;

	# Read only: no request has a body.
	client_max_body_size 1k;

	limit_req zone=explorer_api burst=40 nodelay;
	limit_req_status 429;

	gzip on;
	gzip_types application/json;

	# The service answers GET only (HEAD and OPTIONS get 405 from it too); refuse the rest here.
	if ($request_method != GET) {
		return 405;
	}

	location / {
		proxy_pass http://127.0.0.1:8788;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	# Server-Sent Events: the new best and finalized heads, with a comment line every 20 s. Nothing
	# may buffer or compress it, and the stream stays open for as long as the browser keeps it.
	location = /api/live {
		limit_conn explorer_live 10;
		limit_conn_status 429;

		proxy_pass http://127.0.0.1:8788;
		proxy_http_version 1.1;
		proxy_set_header Connection "";
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_buffering off;
		proxy_cache off;
		gzip off;
		proxy_read_timeout 1h;
		proxy_send_timeout 1h;
	}
}
