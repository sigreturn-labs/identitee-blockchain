# Public JSON-RPC endpoint of the identitee testnet: rpc.identit.ee -> 127.0.0.1:9944.
#
# Installed as /etc/nginx/sites-available/rpc.identit.ee (symlinked into sites-enabled).
# This is the pre-TLS template: `certbot --nginx -d rpc.identit.ee` adds the 443 listener, the
# certificate paths and the HTTP -> HTTPS redirect to the installed copy (see docs/OPERATIONS.md).
# server_name is the reference deployment: set your own host.
#
# The node listens on localhost only and runs with --rpc-methods safe: unsafe methods
# (author_insertKey, author_rotateKeys, system_addReservedPeer...) are refused by the node itself,
# nginx only forwards.

map $http_upgrade $connection_upgrade {
	default upgrade;
	''      close;
}

server {
	listen 80;
	listen [::]:80;
	server_name rpc.identit.ee;

	# Same order of magnitude as the node's own request limit (15 MiB).
	client_max_body_size 16m;

	location / {
		proxy_pass http://127.0.0.1:9944;
		proxy_http_version 1.1;

		# WebSocket upgrade (wss://) and plain HTTP JSON-RPC (POST) on the same path.
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		# Subscriptions stay open for hours: do not cut idle WebSockets after 60 s.
		proxy_read_timeout 1h;
		proxy_send_timeout 1h;
		proxy_buffering off;
	}
}
