# Public HTTPS endpoint of the verification service: verify.identit.ee -> 127.0.0.1:8787.
#
# Installed as /etc/nginx/sites-available/verify.identit.ee (symlinked into sites-enabled).
# This is the pre-TLS template: `certbot --nginx -d verify.identit.ee` adds the 443 listener, the
# certificate paths and the HTTP -> HTTPS redirect to the installed copy (see docs/OPERATIONS.md).
# server_name is the reference deployment: set your own host.
#
# X-Forwarded-For must be $remote_addr (one value), never $proxy_add_x_forwarded_for: the service
# takes the last entry of the header as the client's IP for its per-IP limits, and a header the
# client sent must not be passed along.

server {
	listen 80;
	listen [::]:80;
	server_name verify.identit.ee;

	# The API's bodies are small (the service itself stops at 16 KB).
	client_max_body_size 64k;

	location / {
		proxy_pass http://127.0.0.1:8787;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	# The OAuth callbacks carry the provider's code and state in the query: not in nginx's access log.
	location /oauth/ {
		access_log off;
		proxy_pass http://127.0.0.1:8787;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	# A pasted PGP signature and public key: the service takes up to 192 KB on this route.
	location = /api/pgp/verify {
		client_max_body_size 256k;
		proxy_pass http://127.0.0.1:8787;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
}
