[workspace.package]
authors = ["Sigreturn Labs SAS"]
edition = "2021"
homepage = "https://identit.ee"
license = "AGPL-3.0-only"
repository = "https://github.com/sigreturn-labs/identitee-blockchain"

[workspace]
resolver = "2"
members = ["node", "pallets/identitee", "pallets/validators", "runtime"]

[workspace.lints.rust]
suspicious_double_ref_op = { level = "allow", priority = 2 }
# `cfg` names set by the Polkadot SDK build scripts and macros.
unexpected_cfgs = { level = "warn", check-cfg = [
	'cfg(build_opt_level, values("3"))',
	'cfg(build_profile, values("debug", "release"))',
	'cfg(enable_alloc_error_handler)',
	'cfg(fuzzing)',
	'cfg(ignore_flaky_test)',
	'cfg(substrate_runtime)',
] }

[workspace.lints.clippy]
all = { level = "allow", priority = 0 }
bind_instead_of_map = { level = "allow", priority = 2 }              # stylistic
borrowed-box = { level = "allow", priority = 2 }                     # stylistic
complexity = { level = "warn", priority = 1 }
correctness = { level = "warn", priority = 1 }
default_constructed_unit_structs = { level = "allow", priority = 2 } # stylistic
derivable_impls = { level = "allow", priority = 2 }                  # false positives
eq_op = { level = "allow", priority = 2 }                            # In tests we test equality.
erasing_op = { level = "allow", priority = 2 }                       # E.g. 0 * DOLLARS
extra-unused-type-parameters = { level = "allow", priority = 2 }     # stylistic
identity-op = { level = "allow", priority = 2 }                      # e.g. 0 + offset
if-same-then-else = { level = "allow", priority = 2 }
needless-lifetimes = { level = "allow", priority = 2 }               # generated code
needless_option_as_deref = { level = "allow", priority = 2 }         # false positives
nonminimal-bool = { level = "allow", priority = 2 }                  # stylistic
option-map-unit-fn = { level = "allow", priority = 2 }               # stylistic
stable_sort_primitive = { level = "allow", priority = 2 }            # prefer stable sort
too-many-arguments = { level = "allow", priority = 2 }               # extrinsics take many arguments
type_complexity = { level = "allow", priority = 2 }                  # FRAME types are deep
unit_arg = { level = "allow", priority = 2 }                         # stylistic
unnecessary_cast = { level = "allow", priority = 2 }                 # Types may change
useless_conversion = { level = "allow", priority = 2 }               # Types may change
while_immutable_condition = { level = "allow", priority = 2 }        # false positives
zero-prefixed-literal = { level = "allow", priority = 2 }            # 00_1000_000

[workspace.dependencies]

# Local crates
identitee-runtime = { path = "runtime" }
pallet-identitee = { path = "pallets/identitee", default-features = false }
pallet-validators = { path = "pallets/validators", default-features = false }

# Polkadot SDK stable2606-3 (aligned with psvm) and third-party crates
clap = { version = "4.5.13" }
codec = { version = "3.7.5", default-features = false, package = "parity-scale-codec" }
frame-benchmarking = { version = "49.0.0", default-features = false }
frame-benchmarking-cli = { version = "62.0.0", default-features = false }
frame-executive = { version = "48.0.0", default-features = false }
frame-metadata-hash-extension = { version = "0.16.0", default-features = false }
frame-support = { version = "48.1.0", default-features = false }
frame-system = { version = "48.0.0", default-features = false }
frame-system-benchmarking = { version = "49.0.0", default-features = false }
frame-system-rpc-runtime-api = { version = "43.0.0", default-features = false }
frame-try-runtime = { version = "0.54.0", default-features = false }
futures = { version = "0.3.31" }
jsonrpsee = { version = "0.24.11" }
pallet-aura = { version = "48.0.0", default-features = false }
pallet-authorship = { version = "48.0.0", default-features = false }
pallet-balances = { version = "50.0.0", default-features = false }
pallet-grandpa = { version = "49.0.0", default-features = false }
pallet-skip-feeless-payment = { version = "23.0.0", default-features = false }
pallet-session = { version = "49.0.1", default-features = false }
pallet-sudo = { version = "49.0.0", default-features = false }
pallet-timestamp = { version = "48.0.0", default-features = false }
pallet-transaction-payment = { version = "49.0.0", default-features = false }
pallet-transaction-payment-rpc = { version = "52.0.0", default-features = false }
pallet-transaction-payment-rpc-runtime-api = { version = "49.0.0", default-features = false }
sc-basic-authorship = { version = "0.58.0", default-features = false }
sc-cli = { version = "0.64.0", default-features = false }
sc-client-api = { version = "49.0.0", default-features = false }
sc-consensus = { version = "0.60.0", default-features = false }
sc-consensus-aura = { version = "0.61.0", default-features = false }
sc-consensus-grandpa = { version = "0.46.0", default-features = false }
